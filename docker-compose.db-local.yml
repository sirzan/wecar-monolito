services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wecar}
      POSTGRES_USER: ${DB_USERNAME:-wecar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wecar} -d ${DB_DATABASE:-wecar}"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  queue:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

  scheduler:
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
