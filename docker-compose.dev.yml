services:
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  app:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

  queue:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

  scheduler:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "rm -f public/hot && if [ ! -f node_modules/.bin/vite ]; then npm install --legacy-peer-deps; fi && exec npm run dev"

