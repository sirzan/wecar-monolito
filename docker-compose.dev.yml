services:
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  app:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    volumes:
      - ./:/var/www/html

  queue:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    volumes:
      - ./:/var/www/html

  scheduler:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    volumes:
      - ./:/var/www/html

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      # Código bind-mounted, pero node_modules vive en un volumen propio del
      # contenedor para no mezclar binarios nativos Linux/musl con los del host.
      - ./:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
      - vite_npm_cache:/root/.npm
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
    command: >
      sh -c "
        if ! ./node_modules/.bin/vite --version >/dev/null 2>&1; then
          echo '==> Instalando dependencias en el volumen node_modules del contenedor...' &&
          npm install --legacy-peer-deps;
        fi &&
        if [ ! -f public/build/manifest.json ]; then
          echo '==> Generando build inicial de seguridad...' &&
          npm run build;
        fi &&
        echo '==> Iniciando Vite en modo desarrollo...' &&
        exec npm run dev
      "

volumes:
  vite_node_modules:
  vite_npm_cache:
