services:
  redis:
    ports:
      - "${REDIS_PORT:-6379}:6379"

  app:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
      RUN_MIGRATIONS: ${RUN_MIGRATIONS:-true}
    depends_on:
      postgres:
        condition: service_healthy

  queue:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy

  scheduler:
    environment:
      MAIL_HOST: mailpit
      MAIL_PORT: "1025"
    depends_on:
      postgres:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:latest
    restart: unless-stopped
    ports:
      - "${MAILPIT_PORT:-8025}:8025"
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
    environment:
      MP_MAX_MESSAGES: "5000"
      MP_SMTP_AUTH_ACCEPT_ANY: "1"
      MP_SMTP_AUTH_ALLOW_INSECURE: "1"

  vite:
    image: node:22-alpine
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - vite_node_modules:/var/www/html/node_modules
    ports:
      - "${VITE_PORT:-5173}:5173"
    environment:
      - NODE_ENV=development
    command: sh -c "rm -f public/hot && if [ ! -f node_modules/.bin/vite ]; then npm install --legacy-peer-deps; fi && exec npm run dev"

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_DATABASE:-wecar}
      POSTGRES_USER: ${DB_USERNAME:-wecar}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secret}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-wecar} -d ${DB_DATABASE:-wecar}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
  vite_node_modules:
